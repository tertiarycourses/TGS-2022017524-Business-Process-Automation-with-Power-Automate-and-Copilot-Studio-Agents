<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finance Information Chat</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#eaf1ff;background:#071225}*{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
    main{width:min(780px,100%);background:#101e36;border:1px solid #263c61;border-radius:20px;padding:24px}
    h1{margin:.2rem 0}.sub{color:#aebdd7}.connect{background:#142744;padding:14px;border-radius:12px}
    label{display:block;margin:12px 0 6px;font-weight:700}input,textarea,button{width:100%;font:inherit;border-radius:9px}
    input,textarea{padding:11px;border:1px solid #3b5278;background:#09162a;color:white}textarea{min-height:100px}
    button{margin-top:12px;padding:12px;border:0;background:#39a0ff;color:#031221;font-weight:800;cursor:pointer}
    #chat{display:grid;gap:10px;margin:18px 0}.bubble{padding:13px;border-radius:12px;background:#172b4b;white-space:pre-wrap}
    .user{background:#1d4c7e}.risk{font-size:.9rem;color:#f3cc77}
  </style>
</head>
<body><main>
  <h1>Finance Information Agent</h1>
  <p class="sub">Educational explanations grounded in the approved finance knowledge base.</p>
  <div class="connect">
    <label for="webhook">Power Automate webhook URL</label>
    <input id="webhook" type="url" placeholder="Paste the HTTP trigger URL">
    <button id="save" type="button">Save URL in this browser</button>
  </div>
  <div id="chat" aria-live="polite"><div class="bubble">Ask about finance concepts. Do not enter account or personal financial data.</div></div>
  <form id="form"><label for="prompt">Your question</label><textarea id="prompt" required></textarea><button>Send to agent</button></form>
  <p class="risk">Educational information only; not financial advice.</p>
<script>
const key="lab9Webhook", hook=document.querySelector("#webhook"), chat=document.querySelector("#chat"), promptInput=document.querySelector("#prompt");
hook.value=localStorage.getItem(key)||"";
document.querySelector("#save").onclick=()=>{try{const u=new URL(hook.value);if(u.protocol!=="https:")throw 0;localStorage.setItem(key,u.href);add("Webhook URL saved locally.")}catch{add("Enter a valid HTTPS webhook URL.")}};
function add(text,user=false){const d=document.createElement("div");d.className="bubble"+(user?" user":"");d.textContent=text;chat.append(d);d.scrollIntoView({behavior:"smooth"})}
document.querySelector("#form").onsubmit=async e=>{
  e.preventDefault();let url;try{url=new URL(hook.value);if(url.protocol!=="https:")throw 0}catch{return add("Save a valid HTTPS webhook URL first.")}
  const question=promptInput.value.trim();add(question,true);promptInput.value="";
  const wait=document.createElement("div");wait.className="bubble";wait.textContent="Thinking…";chat.append(wait);
  try{
    const response=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify({prompt:question,conversationId:crypto.randomUUID()})});
    const data=await response.json();if(!response.ok)throw new Error(data.message||"Request failed");
    wait.textContent=(data.reply||"No reply returned.")+(data.disclaimer?"\n\n"+data.disclaimer:"");
  }catch(error){wait.textContent="Unable to get a reply: "+error.message}
};
</script>
<footer><p class="powered-by">Powered by <a href="https://www.tertiaryinfotech.com/" target="_blank" rel="noopener">Tertiary Infotech Academy Pte Ltd</a></p></footer>
</main></body></html>
